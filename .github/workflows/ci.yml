name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck --workspaces --if-present

      - run: npm run test --workspace apps/api

  # The integration suite needs a real Postgres, because what it verifies lives
  # in the database: a UNIQUE constraint picking a winner between two concurrent
  # stage claims, and an ON CONFLICT clause making a replayed write a no-op.
  # PROJECT_REPORT.md section 10 claims both; nothing ran them until this job.
  integration:
    name: Integration — pipeline against Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scholarshield
          POSTGRES_PASSWORD: scholarshield
          POSTGRES_DB: scholarshield
        ports:
          - 5432:5432
        # Without this the first migration races the server's own startup.
        options: >-
          --health-cmd "pg_isready -U scholarshield"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://scholarshield:scholarshield@localhost:5432/scholarshield
      JWT_SECRET: ci-only-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Creates scholarshield_test and migrates it. The suite refuses to run
      # against a database whose name does not end in `_test`, because it
      # truncates between cases -- pointed at a developer's database it
      # destroys their work, which is not hypothetical.
      - name: Create and migrate the test database
        run: npm run test:integration:setup

      - name: Run the integration suite
        run: npm run test:integration

  # The OCR and forensics service is ~825 lines of Python with its own suite,
  # and until this job existed none of it ran on a push. It is the half of the
  # system most able to break silently: a change in how a page is deskewed or
  # how ELA is computed produces no type error and no failing Node test, just a
  # different number in the metrics nobody reruns.
  python:
    name: Python — OCR and forensics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ocr-service/requirements.txt

      # Tesseract is a system binary rather than a wheel, and the extraction
      # tests are meaningless without it — skipping them here would recreate
      # exactly the silence this job exists to end.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Install dependencies
        working-directory: apps/ocr-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The `slow` marker is deselected by pytest.ini: those tests need the
      # generated corpus, which is built by `npm run seed:documents` and is not
      # in the repository. Everything else runs.
      - name: Run tests
        working-directory: apps/ocr-service
        run: pytest

  # The published metrics are a claim the README makes in the user's name, so
  # the script that writes them has to at least still run. This does not assert
  # a number -- thresholds are a judgement, not a build failure -- it asserts
  # the harness is not broken, which is what silently rots.
  metrics:
    name: Metrics harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The corpus is generated, not committed, and it is byte-stable for a
      # given seed — `corpus.test.ts` asserts that. Regenerating it here is what
      # makes the document metrics reproducible rather than remembered.
      - name: Generate the document corpus
        run: npm run seed:documents

      # metrics.ts runs the document measurement inside this image when there is
      # no local virtualenv, so the published OCR and ELA numbers come from the
      # pinned Tesseract in it rather than from whatever the runner happens to
      # have installed.
      - name: Build the OCR service image
        run: docker compose -f infra/docker-compose.yml build ocr-service

      - name: Run the metrics harness
        run: npm run metrics

      # If this fails, the committed README disagrees with what the engine now
      # produces, and one of the two needs updating before the claim is made.
      - name: Fail if README metrics are stale
        run: git diff --exit-code -- README.md
