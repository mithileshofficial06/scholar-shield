name: scholarshield

services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarshield-postgres
    environment:
      POSTGRES_USER: scholarshield
      POSTGRES_PASSWORD: scholarshield
      POSTGRES_DB: scholarshield
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarshield -d scholarshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scholarshield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: scholarshield-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scholarshield
      MINIO_ROOT_PASSWORD: scholarshield
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the documents bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: scholarshield-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 scholarshield scholarshield &&
      mc mb --ignore-existing local/scholarshield-documents &&
      mc anonymous set none local/scholarshield-documents &&
      echo 'bucket ready — private, signed URLs only'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
