[pytest]
testpaths = tests
pythonpath = . tests
addopts = -m "not slow" -q
markers =
    slow: needs the generated corpus (npm run seed:documents) and runs OCR over
        every document. Deselected by default so the suite stays usable during
        development; run with `-m slow` or `-m ""`, and note that the published
        metrics come from `npm run metrics`, not from here.
